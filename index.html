<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptiPulse - Optical Management System</title>
  
  <!-- Supabase JS Client library v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 15px 25px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    h1 { font-size: 1.5rem; color: var(--primary); }
    
    .auth-box, .app-content { background: var(--surface); padding: 25px; border-radius: 8px; border: 1px solid var(--border); }
    .hidden { display: none !important; }
    
    form { display: grid; gap: 15px; margin-top: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

    input, select, button { padding: 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.95rem; }
    button { background: var(--primary); color: white; font-weight: 600; cursor: pointer; border: none; }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #64748b; }
    button.danger { background: var(--danger); }

    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background-color: var(--bg); }

    .rx-box { background: #f1f5f9; padding: 15px; border-radius: 6px; }
    .rx-title { font-weight: bold; margin-bottom: 10px; }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .nav-tabs button { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .nav-tabs button.active { background: var(--primary); color: white; }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <header>
    <h1>OptiPulse</h1>
    <div id="user-info" class="hidden">
      Logged in as: <strong id="user-email-display"></strong>
      <button onclick="handleSignOut()" class="secondary" style="margin-left: 10px; padding: 6px 12px;">Sign Out</button>
    </div>
  </header>

  <!-- Step 1: Authentication View -->
  <div id="auth-section" class="auth-box">
    <h2>Login / Verification</h2>
    <p style="color: #64748b; margin-top: 5px;">Enter your Gmail to receive a 6-digit OTP code.</p>
    
    <!-- Email Step -->
    <div id="email-step">
      <div class="form-group" style="margin-top: 15px;">
        <label>Gmail Address</label>
        <input type="email" id="auth-email" placeholder="your.name@gmail.com" required>
      </div>
      <button onclick="handleSendOTP()" style="margin-top: 10px;">Send 6-Digit OTP</button>
    </div>

    <!-- OTP Step -->
    <div id="otp-step" class="hidden">
      <div class="form-group" style="margin-top: 15px;">
        <label>Enter 6-Digit OTP Code</label>
        <input type="text" id="auth-otp" maxlength="6" placeholder="123456" pattern="\d{6}">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button onclick="handleVerifyOTP()">Verify Code & Log In</button>
        <button onclick="resetAuthView()" class="secondary">Back</button>
      </div>
    </div>
  </div>

  <!-- Step 2: Main Application View -->
  <div id="app-section" class="app-content hidden">
    <div class="nav-tabs">
      <button id="tab-dashboard-btn" class="active" onclick="switchTab('dashboard')">Customer Directory</button>
      <button id="tab-form-btn" onclick="switchTab('form')">+ New Customer Record</button>
    </div>

    <!-- Tab 1: Dashboard / Orders List -->
    <div id="tab-dashboard">
      <h3>Customer Orders</h3>
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer Name</th>
            <th>Phone</th>
            <th>Item</th>
            <th>Total ($)</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="orders-table-body">
          <tr><td colspan="6" style="text-align: center;">Loading data from Supabase...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Tab 2: New/Edit Customer Form -->
    <div id="tab-form" class="hidden">
      <h3 id="form-title">New Customer Entry</h3>
      <form onsubmit="handleSaveCustomer(event)" id="customer-form">
        <input type="hidden" id="editing-order-id">
        
        <div class="grid-2">
          <div class="form-group">
            <label>Customer Name *</label>
            <input type="text" id="cust-name" required>
          </div>
          <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" id="cust-phone" required>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Customer Email</label>
            <input type="email" id="cust-email">
          </div>
          <div class="form-group">
            <label>Age</label>
            <input type="number" id="cust-age">
          </div>
        </div>

        <!-- Prescription Section -->
        <div class="rx-box">
          <div class="rx-title">Eye Prescription (Rx)</div>
          <div style="margin-bottom: 8px; font-weight: 500;">Right Eye (OD)</div>
          <div class="grid-4">
            <input type="text" id="rx-od-sph" placeholder="SPH">
            <input type="text" id="rx-od-cyl" placeholder="CYL">
            <input type="text" id="rx-od-axis" placeholder="AXIS">
            <input type="text" id="rx-od-add" placeholder="ADD">
          </div>
          <div style="margin: 10px 0 8px; font-weight: 500;">Left Eye (OS)</div>
          <div class="grid-4">
            <input type="text" id="rx-os-sph" placeholder="SPH">
            <input type="text" id="rx-os-cyl" placeholder="CYL">
            <input type="text" id="rx-os-axis" placeholder="AXIS">
            <input type="text" id="rx-os-add" placeholder="ADD">
          </div>
        </div>

        <!-- Billing -->
        <div class="grid-2">
          <div class="form-group">
            <label>Item Description</label>
            <input type="text" id="order-item" placeholder="Single Vision Lens + Frame" required>
          </div>
          <div class="form-group">
            <label>Total Price ($)</label>
            <input type="number" step="0.01" id="order-total" required>
          </div>
        </div>

        <div style="display: flex; gap: 10px;">
          <button type="submit">Save Record Permanently to Cloud</button>
          <button type="button" class="secondary" onclick="switchTab('dashboard')">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // -------------------------------------------------------------
  // 1. SUPABASE CONFIGURATION
  // Replace these strings with your actual Supabase URL & Key:
  // -------------------------------------------------------------
  const SUPABASE_URL = "YOUR_SUPABASE_URL_HERE"; 
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";
  
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUserEmail = null;
  let ordersList = [];

  // Check auth session on application boot
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && session.user) {
      currentUserEmail = session.user.email;
      showAppScreen();
    }
  });

  // -------------------------------------------------------------
  // 2. AUTHENTICATION (OTP OVER GMAIL)
  // -------------------------------------------------------------
  async function handleSendOTP() {
    const email = document.getElementById('auth-email').value.trim();
    if (!email) return alert("Please enter your Gmail address.");

    const { error } = await supabaseClient.auth.signInWithOtp({ email });
    if (error) {
      alert("Error sending OTP: " + error.message);
    } else {
      currentUserEmail = email;
      document.getElementById('email-step').classList.add('hidden');
      document.getElementById('otp-step').classList.remove('hidden');
      alert("6-digit OTP code sent to " + email);
    }
  }

  async function handleVerifyOTP() {
    const token = document.getElementById('auth-otp').value.trim();
    if (token.length !== 6) return alert("Please enter a valid 6-digit OTP code.");

    const { data, error } = await supabaseClient.auth.verifyOtp({
      email: currentUserEmail,
      token: token,
      type: 'email'
    });

    if (error) {
      alert("Verification failed: " + error.message);
    } else {
      currentUserEmail = data.user.email;
      showAppScreen();
    }
  }

  function resetAuthView() {
    document.getElementById('email-step').classList.remove('hidden');
    document.getElementById('otp-step').classList.add('hidden');
  }

  async function handleSignOut() {
    await supabaseClient.auth.signOut();
    currentUserEmail = null;
    document.getElementById('user-info').classList.add('hidden');
    document.getElementById('app-section').classList.add('hidden');
    document.getElementById('auth-section').classList.remove('hidden');
    resetAuthView();
  }

  function showAppScreen() {
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');
    document.getElementById('user-info').classList.remove('hidden');
    document.getElementById('user-email-display').innerText = currentUserEmail;
    fetchOrdersFromCloud();
  }

  // -------------------------------------------------------------
  // 3. PERSISTENT CLOUD DATA OPERATIONS (SUPABASE DB)
  // -------------------------------------------------------------
  
  // FETCH ALL RECORDS
  async function fetchOrdersFromCloud() {
    if (!currentUserEmail) return;

    const { data, error } = await supabaseClient
      .from('orders')
      .select('order_data')
      .eq('user_email', currentUserEmail);

    if (error) {
      console.error("Cloud fetch error:", error);
      alert("Failed to fetch customer data from cloud.");
      return;
    }

    ordersList = data ? data.map(row => row.order_data) : [];
    renderOrdersTable();
  }

  // SAVE OR UPDATE A RECORD
  async function handleSaveCustomer(event) {
    event.preventDefault();
    const editingId = document.getElementById('editing-order-id').value;

    const record = {
      id: editingId || 'ORD-' + Date.now(),
      customerName: document.getElementById('cust-name').value,
      phone: document.getElementById('cust-phone').value,
      email: document.getElementById('cust-email').value,
      age: document.getElementById('cust-age').value,
      rx: {
        odSph: document.getElementById('rx-od-sph').value,
        odCyl: document.getElementById('rx-od-cyl').value,
        odAxis: document.getElementById('rx-od-axis').value,
        odAdd: document.getElementById('rx-od-add').value,
        osSph: document.getElementById('rx-os-sph').value,
        osCyl: document.getElementById('rx-os-cyl').value,
        osAxis: document.getElementById('rx-os-axis').value,
        osAdd: document.getElementById('rx-os-add').value,
      },
      item: document.getElementById('order-item').value,
      total: document.getElementById('order-total').value
    };

    // Upsert into Supabase (Cloud Database)
    const { error } = await supabaseClient
      .from('orders')
      .upsert({
        id: record.id,
        user_email: currentUserEmail,
        customer_name: record.customerName,
        phone: record.phone,
        order_data: record
      });

    if (error) {
      alert("Error saving record to cloud: " + error.message);
      return;
    }

    alert("Record permanently saved to Supabase!");
    document.getElementById('customer-form').reset();
    document.getElementById('editing-order-id').value = '';
    
    await fetchOrdersFromCloud();
    switchTab('dashboard');
  }

  // DELETE A RECORD
  async function deleteOrder(orderId) {
    if (!confirm("Are you sure you want to permanently delete this customer record?")) return;

    const { error } = await supabaseClient
      .from('orders')
      .delete()
      .eq('id', orderId)
      .eq('user_email', currentUserEmail);

    if (error) {
      alert("Could not delete from cloud: " + error.message);
      return;
    }

    await fetchOrdersFromCloud();
  }

  // -------------------------------------------------------------
  // 4. UI RENDER & TABS
  // -------------------------------------------------------------
  function renderOrdersTable() {
    const tbody = document.getElementById('orders-table-body');
    if (ordersList.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No records saved yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = ordersList.map(item => `
      <tr>
        <td>${item.id}</td>
        <td><strong>${item.customerName}</strong></td>
        <td>${item.phone}</td>
        <td>${item.item}</td>
        <td>$${item.total}</td>
        <td>
          <button onclick="editOrder('${item.id}')" style="padding: 4px 8px; font-size: 0.8rem;">Edit</button>
          <button onclick="deleteOrder('${item.id}')" class="danger" style="padding: 4px 8px; font-size: 0.8rem;">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  function editOrder(orderId) {
    const item = ordersList.find(o => o.id === orderId);
    if (!item) return;

    document.getElementById('editing-order-id').value = item.id;
    document.getElementById('cust-name').value = item.customerName || '';
    document.getElementById('cust-phone').value = item.phone || '';
    document.getElementById('cust-email').value = item.email || '';
    document.getElementById('cust-age').value = item.age || '';
    
    if (item.rx) {
      document.getElementById('rx-od-sph').value = item.rx.odSph || '';
      document.getElementById('rx-od-cyl').value = item.rx.odCyl || '';
      document.getElementById('rx-od-axis').value = item.rx.odAxis || '';
      document.getElementById('rx-od-add').value = item.rx.odAdd || '';
      document.getElementById('rx-os-sph').value = item.rx.osSph || '';
      document.getElementById('rx-os-cyl').value = item.rx.osCyl || '';
      document.getElementById('rx-os-axis').value = item.rx.osAxis || '';
      document.getElementById('rx-os-add').value = item.rx.osAdd || '';
    }

    document.getElementById('order-item').value = item.item || '';
    document.getElementById('order-total').value = item.total || '';

    document.getElementById('form-title').innerText = 'Edit Customer Record';
    switchTab('form');
  }

  function switchTab(tabName) {
    if (tabName === 'dashboard') {
      document.getElementById('tab-dashboard').classList.remove('hidden');
      document.getElementById('tab-form').classList.add('hidden');
      document.getElementById('tab-dashboard-btn').classList.add('active');
      document.getElementById('tab-form-btn').classList.remove('active');
    } else {
      document.getElementById('tab-dashboard').classList.add('hidden');
      document.getElementById('tab-form').classList.remove('hidden');
      document.getElementById('tab-dashboard-btn').classList.remove('active');
      document.getElementById('tab-form-btn').classList.add('active');
    }
  }
</script>

</body>
</html>
