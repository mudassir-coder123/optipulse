<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OptiPulse Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Header / Navbar -->
  <header class="bg-blue-600 text-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-wide">OptiPulse</h1>
      <button onclick="openNewCustomerModal()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-blue-50 transition shadow-sm">
        + New Customer
      </button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex border-b border-gray-300 mb-6">
      <button id="tab-dashboard-btn" onclick="switchTab('dashboard')" class="px-6 py-2 border-b-2 border-blue-600 font-semibold text-blue-600">
        Active Orders
      </button>
      <button id="tab-history-btn" onclick="switchTab('history')" class="px-6 py-2 text-gray-600 font-semibold hover:text-blue-600">
        Customer History
      </button>
    </div>

    <!-- Dashboard View -->
    <section id="view-dashboard">
      <h2 class="text-xl font-bold mb-4 text-gray-700">Active Order Cards</h2>
      <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Active Order Cards Render Here -->
      </div>
    </section>

    <!-- History View -->
    <section id="view-history" class="hidden">
      <h2 class="text-xl font-bold mb-4 text-gray-700">Customer Records</h2>
      <div id="history-list">
        <!-- History Cards Render Here -->
      </div>
    </section>
  </main>

  <!-- App Script -->
  <script>
    // --- Initial State Data ---
    let appData = {
      customers: [
        {
          id: "cust_101",
          customerId: "CUST-1001",
          name: "Acme Corp",
          email: "contact@acme.com",
          phone: "555-0192",
          createdAt: "2026-01-15T10:00:00.000Z",
          purchases: [
            { id: "ORD-501", item: "Enterprise Analytics License", amount: 1200, status: "Active", date: "2026-08-01" },
            { id: "ORD-502", item: "Setup & Integration Support", amount: 450, status: "Delivered", date: "2026-08-02" }
          ]
        },
        {
          id: "cust_102",
          customerId: "CUST-1002",
          name: "Nexus Labs",
          email: "support@nexus.io",
          phone: "555-0481",
          createdAt: "2026-02-10T14:30:00.000Z",
          purchases: [
            { id: "ORD-503", item: "Custom API Integration", amount: 850, status: "Active", date: "2026-08-03" }
          ]
        }
      ]
    };

    // Load from Local Storage if available
    function loadStorage() {
      const saved = localStorage.getItem("optipulse_data");
      if (saved) {
        try { appData = JSON.parse(saved); } catch (e) { console.error(e); }
      }
    }

    function saveStorage() {
      localStorage.setItem("optipulse_data", JSON.stringify(appData));
    }

    function getCustomers() {
      return appData.customers;
    }

    // --- ID Generator ---
    function generateCustomerId() {
      const customers = getCustomers();
      const existingIds = customers
        .map(c => parseInt((c.customerId || c.displayId || '').replace(/\D/g, ''), 10))
        .filter(n => !isNaN(n));
      
      const maxId = existingIds.length > 0 ? Math.max(...existingIds) : 1000;
      return `CUST-${maxId + 1}`;
    }

    // --- Customer Creation ---
    function createCustomerRecord(name, email, phone) {
      const newCust = {
        id: `cust_${Date.now()}`,
        customerId: generateCustomerId(),
        name,
        email,
        phone,
        createdAt: new Date().toISOString(),
        purchases: []
      };
      appData.customers.push(newCust);
      saveStorage();
      renderApp();
      return newCust;
    }

    // --- Order Operations ---
    function deliverOrder(custId, orderId) {
      const customer = appData.customers.find(c => c.id === custId || c.customerId === custId);
      if (!customer) return;

      const order = customer.purchases.find(o => o.id === orderId);
      if (order) {
        order.status = "Delivered";
        saveStorage();
        renderApp();
      }
    }

    function deleteOrder(custId, orderId) {
      if (!confirm("Are you sure you want to delete this order? This action cannot be undone.")) {
        return;
      }

      const customer = appData.customers.find(c => c.id === custId || c.customerId === custId);
      if (!customer) {
        alert("Customer not found.");
        return;
      }

      const initialCount = customer.purchases.length;
      customer.purchases = customer.purchases.filter(o => o.id !== orderId);

      if (customer.purchases.length === initialCount) {
        alert("Order not found.");
        return;
      }

      saveStorage();
      renderApp();
    }

    function editOrder(custId, orderId) {
      const customer = appData.customers.find(c => c.id === custId || c.customerId === custId);
      if (!customer) return;

      const order = customer.purchases.find(o => o.id === orderId);
      if (!order) return;

      const newItem = prompt("Update Item Name:", order.item);
      const newAmount = prompt("Update Amount ($):", order.amount);

      if (newItem !== null && newAmount !== null) {
        order.item = newItem || order.item;
        order.amount = parseFloat(newAmount) || order.amount;
        saveStorage();
        renderApp();
      }
    }

    // --- Printing ---
    function printCustomerRecord(custId) {
      const customer = appData.customers.find(c => c.id === custId || c.customerId === custId);
      if (!customer) {
        alert("Customer record not found.");
        return;
      }

      const printWindow = window.open("", "_blank", "width=800,height=900");
      const purchasesHtml = (customer.purchases || []).length > 0
        ? customer.purchases.map(o => `
            <tr>
              <td style="padding: 8px; border-bottom: 1px solid #e5e7eb;">${o.id || 'N/A'}</td>
              <td style="padding: 8px; border-bottom: 1px solid #e5e7eb;">${o.item || 'Order'}</td>
              <td style="padding: 8px; border-bottom: 1px solid #e5e7eb;">$${Number(o.amount || 0).toFixed(2)}</td>
              <td style="padding: 8px; border-bottom: 1px solid #e5e7eb;">${o.status || 'Completed'}</td>
              <td style="padding: 8px; border-bottom: 1px solid #e5e7eb;">${o.date || 'N/A'}</td>
            </tr>
          `).join('')
        : `<tr><td colspan="5" style="padding: 12px; text-align: center; color: #6b7280;">No purchase history found.</td></tr>`;

      printWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Customer Record - ${customer.name}</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; color: #1f2937; }
            .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3b82f6; padding-bottom: 12px; margin-bottom: 20px; }
            .badge { background: #dbeafe; color: #1e40af; font-weight: bold; padding: 4px 8px; border-radius: 4px; font-size: 14px; }
            .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; background: #f9fafb; padding: 16px; border-radius: 6px; }
            table { width: 100%; border-collapse: collapse; margin-top: 12px; }
            th { text-align: left; background: #f3f4f6; padding: 8px; border-bottom: 2px solid #e5e7eb; }
          </style>
        </head>
        <body>
          <div class="header">
            <h2>Customer Profile</h2>
            <span class="badge">${customer.customerId || customer.id}</span>
          </div>
          <div class="info-grid">
            <div><strong>Name:</strong> ${customer.name}</div>
            <div><strong>Email:</strong> ${customer.email || 'N/A'}</div>
            <div><strong>Phone:</strong> ${customer.phone || 'N/A'}</div>
            <div><strong>Member Since:</strong> ${new Date(customer.createdAt || Date.now()).toLocaleDateString()}</div>
          </div>
          <h3>Purchase History</h3>
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Item / Description</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody>
              ${purchasesHtml}
            </tbody>
          </table>
        </body>
        </html>
      `);

      printWindow.document.close();
      printWindow.focus();
      setTimeout(() => { printWindow.print(); }, 250);
    }

    // --- UI Renderers ---
    function renderDashboard() {
      const grid = document.getElementById("dashboard-grid");
      let activeCardsHtml = "";

      appData.customers.forEach(customer => {
        const customerIdBadge = customer.customerId || customer.id;

        customer.purchases.forEach(order => {
          if (order.status === "Active") {
            activeCardsHtml += `
              <div class="dashboard-card border rounded-lg p-4 shadow-sm bg-white hover:shadow-md transition">
                <div class="flex justify-between items-center mb-2">
                  <h4 class="font-bold text-lg flex items-center gap-2">
                    ${customer.name}
                    <span class="px-2 py-0.5 text-xs font-semibold bg-blue-100 text-blue-800 rounded-full">
                      ${customerIdBadge}
                    </span>
                  </h4>
                  <span class="px-2 py-1 text-xs rounded font-medium bg-yellow-100 text-yellow-800">
                    ${order.status}
                  </span>
                </div>

                <div class="text-sm text-gray-600 mb-4">
                  <p><strong>Order ID:</strong> ${order.id}</p>
                  <p><strong>Item:</strong> ${order.item}</p>
                  <p><strong>Total:</strong> $${Number(order.amount || 0).toFixed(2)}</p>
                </div>

                <div class="flex gap-2 justify-end border-t pt-3">
                  <button 
                    onclick="deliverOrder('${customer.id}', '${order.id}')"
                    class="px-3 py-1.5 text-xs font-medium bg-green-600 text-white rounded hover:bg-green-700 transition">
                    Deliver Order
                  </button>
                  <button 
                    onclick="deleteOrder('${customer.id}', '${order.id}')"
                    class="px-3 py-1.5 text-xs font-medium bg-red-600 text-white rounded hover:bg-red-700 transition">
                    Delete
                  </button>
                </div>
              </div>
            `;
          }
        });
      });

      grid.innerHTML = activeCardsHtml || `<div class="col-span-full text-center text-gray-500 py-8">No active orders pending.</div>`;
    }

    function renderHistory() {
      const list = document.getElementById("history-list");

      list.innerHTML = appData.customers.map(customer => {
        const customerIdBadge = customer.customerId || customer.id;

        const orderRowsHtml = (customer.purchases || []).map(order => `
          <tr class="border-b text-sm hover:bg-gray-50">
            <td class="py-2.5 px-3 font-mono">${order.id || 'N/A'}</td>
            <td class="py-2.5 px-3 font-medium">${order.item || 'Order'}</td>
            <td class="py-2.5 px-3">$${Number(order.amount || 0).toFixed(2)}</td>
            <td class="py-2.5 px-3">
              <span class="px-2 py-0.5 text-xs rounded font-medium ${
                order.status === 'Active' ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800'
              }">
                ${order.status || 'Completed'}
              </span>
            </td>
            <td class="py-2.5 px-3 flex gap-2 justify-end">
              <button 
                onclick="editOrder('${customer.id}', '${order.id}')" 
                class="px-2 py-1 text-xs font-medium bg-amber-500 text-white rounded hover:bg-amber-600 transition">
                Edit
              </button>
              <button 
                onclick="deleteOrder('${customer.id}', '${order.id}')" 
                class="px-2 py-1 text-xs font-medium bg-red-600 text-white rounded hover:bg-red-700 transition">
                Delete
              </button>
            </td>
          </tr>
        `).join('');

        return `
          <div class="history-card bg-white border rounded-lg p-5 mb-6 shadow-sm">
            <div class="flex justify-between items-center mb-4">
              <div>
                <h3 class="text-xl font-bold flex items-center gap-2">
                  ${customer.name}
                  <span class="px-2.5 py-0.5 text-xs font-semibold bg-blue-100 text-blue-800 rounded-full">
                    ${customerIdBadge}
                  </span>
                </h3>
                <p class="text-xs text-gray-500">${customer.email || 'No email'} • ${customer.phone || 'No phone'}</p>
              </div>
              <button 
                onclick="printCustomerRecord('${customer.id}')"
                class="px-3 py-1.5 text-sm font-medium bg-gray-800 text-white rounded flex items-center gap-1 hover:bg-gray-900 transition">
                🖨️ Print
              </button>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-gray-50 border-b text-xs text-gray-500 uppercase">
                    <th class="py-2 px-3">Order ID</th>
                    <th class="py-2 px-3">Item</th>
                    <th class="py-2 px-3">Amount</th>
                    <th class="py-2 px-3">Status</th>
                    <th class="py-2 px-3 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${orderRowsHtml || '<tr><td colspan="5" class="py-4 text-center text-gray-400">No orders recorded.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderApp() {
      renderDashboard();
      renderHistory();
    }

    // --- Tab Switching ---
    function switchTab(tab) {
      const dashView = document.getElementById("view-dashboard");
      const histView = document.getElementById("view-history");
      const dashBtn = document.getElementById("tab-dashboard-btn");
      const histBtn = document.getElementById("tab-history-btn");

      if (tab === 'dashboard') {
        dashView.classList.remove("hidden");
        histView.classList.add("hidden");
        dashBtn.className = "px-6 py-2 border-b-2 border-blue-600 font-semibold text-blue-600";
        histBtn.className = "px-6 py-2 text-gray-600 font-semibold hover:text-blue-600";
      } else {
        dashView.classList.add("hidden");
        histView.classList.remove("hidden");
        dashBtn.className = "px-6 py-2 text-gray-600 font-semibold hover:text-blue-600";
        histBtn.className = "px-6 py-2 border-b-2 border-blue-600 font-semibold text-blue-600";
      }
    }

    // --- Quick Add Prompt ---
    function openNewCustomerModal() {
      const name = prompt("Enter New Customer Name:");
      if (!name) return;
      const email = prompt("Enter Customer Email:", "");
      const phone = prompt("Enter Customer Phone:", "");
      createCustomerRecord(name, email, phone);
    }

    // Initial Launch
    window.addEventListener("DOMContentLoaded", () => {
      loadStorage();
      renderApp();
    });
  </script>
</body>
</html>
